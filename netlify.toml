[build]
  publish = "site"

# Images and exported design assets rarely change: let browsers reuse them for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/now-creative-guide/build/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/now-creative-guide/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS and scripts: reuse for an hour, then check for updates.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
