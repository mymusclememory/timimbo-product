[build]
  publish = "site"

# Images and exported design assets rarely change: let browsers reuse them for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/now-creative-guide/build/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/now-creative-guide/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS and scripts: always check for a newer copy (a quick 304 when nothing changed).
# Pages also link them with ?v=<date>, so a changed file is never mixed with an old one.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
